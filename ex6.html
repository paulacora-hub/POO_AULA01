<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questao 6</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            color: #4a2c3a;
            padding: 30px;
            max-width: 450px;
            margin: 0 auto;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            color: #6b4c5e;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.2);
            transition: background-color 0.2s, transform 0.1s;
            margin: 20px 0;
        }

        button:hover {
            background-color: #ff1493;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .painel {
            background: #ffffff;
            padding: 20px;
            border: 2px solid #ffb6c1;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .painel h3 {
            margin-top: 0;
            color: #ff1493;
            font-size: 1.1rem;
            border-bottom: 1px solid #ffe4e1;
            padding-bottom: 8px;
        }

        code {
            background-color: #fff0f5;
            color: #c71585;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .painel p {
            text-align: left;
            font-size: 0.9rem;
            margin: 10px 0;
        }
    </style>
    <script>
        class Livro {
            constructor(titulo, autor) {
                this.titulo = titulo;
                this.autor = autor;
                this.disponivel = true;
            }

            emprestar() {
                if (this.disponivel) {
                    this.disponivel = false;
                } else {
                    console.log(`O livro "${this.titulo}" já está emprestado e não pode ser pego novamente.`);
                }
            }

            devolver() {
                this.disponivel = true;
            }
        }

        class Biblioteca {
            constructor() {
                this.acervo = [];
            }

            adicionarLivro(livro) {
                this.acervo.push(livro);
            }

            listarDisponiveis() {
                console.log("Livros Disponíveis");
                for (const livro of this.acervo) {
                    if (livro.disponivel) {
                        console.log(`- ${livro.titulo} (${livro.autor})`);
                    }
                }
            }
        }

        const minhaBiblioteca = new Biblioteca();
        
        const livro1 = new Livro("Quarta Asa", "Rebecca Yarros");
        const livro2 = new Livro("Jujutsu Kaisen", "Gege Akutami");
        const livro3 = new Livro("Corte de espinhos e rosas", "Sarah J. Maas");

        minhaBiblioteca.adicionarLivro(livro1);
        minhaBiblioteca.adicionarLivro(livro2);
        minhaBiblioteca.adicionarLivro(livro3);

        function rodarTestesPadrao() {
            minhaBiblioteca.listarDisponiveis();
            
            livro2.emprestar();
            minhaBiblioteca.listarDisponiveis();
            
            livro2.emprestar();
            livro2.devolver();
            minhaBiblioteca.listarDisponiveis();
        }
    </script>
</head>

<body>

    <h1>Exercício 6 - Biblioteca</h1>
    <p>Para ver os resultados clique F12 ou Crtl+Shift+J</p>

    <button onclick="rodarTestesPadrao()">Simular Empréstimos </button>

    <div class="painel">
        <h3>Comandos executados:</h3>
        <p>1. <code>minhaBiblioteca.listarDisponiveis();</code></p>
        <p>2. <code>livro2.emprestar();</code></p>
        <p>3. <code>minhaBiblioteca.listarDisponiveis();</code></p>
        <p>4. <code>livro2.emprestar();</code></p>
        <p>5. <code>livro2.devolver();</code></p>
        <p>6. <code>minhaBiblioteca.listarDisponiveis();</code></p>
    </div>

</body>

</html>
