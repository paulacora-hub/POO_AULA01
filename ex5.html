<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questao 5</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            color: #4a2c3a;
            padding: 30px;
            max-width: 450px;
            margin: 0 auto;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            color: #6b4c5e;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.2);
            transition: background-color 0.2s, transform 0.1s;
            margin: 20px 0;
        }

        button:hover {
            background-color: #ff1493;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .painel {
            background: #ffffff;
            padding: 20px;
            border: 2px solid #ffb6c1;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .painel h3 {
            margin-top: 0;
            color: #ff1493;
            font-size: 1.1rem;
            border-bottom: 1px solid #ffe4e1;
            padding-bottom: 8px;
        }

        code {
            background-color: #fff0f5;
            color: #c71585;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .painel p {
            text-align: left;
            font-size: 0.9rem;
            margin: 10px 0;
        }
    </style>
    <script>
        class Carro {
            constructor(marca, modelo, ano, preco) {
                this.marca = marca;
                this.modelo = modelo;
                this.ano = ano;
                this.preco = preco;
            }
        }

        function filtrarCarrosPorAno(frota, anoMinimo) {
            const carrosFiltrados = [];
            for (const carro of frota) {
                if (carro.ano >= anoMinimo) {
                    carrosFiltrados.push(carro);
                }
            }
            return carrosFiltrados;
        }

        function calcularValorTotalFrota(frota) {
            let total = 0;
            for (const carro of frota) {
                total += carro.preco;
            }
            return total;
        }

        const minhaFrota = [
            new Carro("Porsche", "911 GT3 (Geração 992.2)", 2026, 1620000),
            new Carro("McLaren", "Artura Coupe", 2026, 3007000),
            new Carro("Ferrari", "F40", 1992, 48000000),
            new Carro("Lamborghini Diablo", "Motor V12 5.7", 1997, 2690000),
            new Carro("Volkswagen", "Fusca", 1975, 15000)
        ];

        function rodarTestesPadrao() {
            console.log(" Frota Completa ");
            console.log(minhaFrota);

            console.log(" Carros Fabricados a partir de 2018");
            const carrosNovos = filtrarCarrosPorAno(minhaFrota, 2018);
            console.table(carrosNovos);

            console.log("Valor de Mercado da Frota ");
            const valorTotal = calcularValorTotalFrota(minhaFrota);
            console.log(`Total: R$ ${valorTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`);
        }
    </script>
</head>

<body>

    <h1>Exercício 5 - Frota de Carros</h1>
    <p>Para ver os resultados clique F12 ou Crtl+Shift+J</p>

    <button onclick="rodarTestesPadrao()">Analisar Frota </button>

    <div class="painel">
        <h3>Comandos executados:</h3>
        <p>1. <code>console.log(minhaFrota);</code></p>
        <p>2. <code>filtrarCarrosPorAno(minhaFrota, 2018);</code></p>
        <p>3. <code>calcularValorTotalFrota(minhaFrota);</code></p>
    </div>

</body>

</html>
