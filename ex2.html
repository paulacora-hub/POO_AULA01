<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questao 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            color: #4a2c3a;
            padding: 30px;
            max-width: 450px;
            margin: 0 auto;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            color: #6b4c5e;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.2);
            transition: background-color 0.2s, transform 0.1s;
            margin: 20px 0;
        }

        button:hover {
            background-color: #ff1493;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .painel {
            background: #ffffff;
            padding: 20px;
            border: 2px solid #ffb6c1;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .painel h3 {
            margin-top: 0;
            color: #ff1493;
            font-size: 1.1rem;
            border-bottom: 1px solid #ffe4e1;
            padding-bottom: 8px;
        }

        code {
            background-color: #fff0f5;
            color: #c71585;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .painel p {
            text-align: left;
            font-size: 0.9rem;
            margin: 10px 0;
        }
    </style>
    <script>
        class Termostato {
            constructor(temperatura = 20) {
                this.temperatura = temperatura;
            }

            aumentarTemp(temp) {
                if (this.temperatura + temp <= 35) {
                    this.temperatura += temp;
                    console.log(`Temperatura alterada para: ${this.temperatura}°C`);
                } else {
                    console.log(`Erro: A temperatura que você escolheu está muito alta, escolha uma temperatura mais baixa`);
                }
            }

            diminuirTemp(temp) {
                if (this.temperatura - temp >= 10) {
                    this.temperatura -= temp;
                    console.log(`Temperatura alterada para: ${this.temperatura}°C`);
                } else {
                    console.log(`Erro: A temperatura que você escolheu está muito baixa, escolha uma temperatura mais alta`);
                }
            }

            status() {
                console.log(`Agora a temperatura está ${this.temperatura}°C`);
            }
        }

        //const minhaTemp = new Termostato(20);
        //minhaTemp.aumentarTemp(90);
        //minhaTemp.diminuirTemp(5);

        let minhaTemp;

        function rodarTestesPadrao() {
            minhaTemp = new Termostato(20);
            minhaTemp.aumentarTemp(90);
            minhaTemp.diminuirTemp(5);
        }
    </script>
</head>

<body>

    <h1>Exercício 2 - Termostato</h1>
    <p>Para ver os resultados clique F12 ou Crtl+Shift+J</p>

    <button onclick="rodarTestesPadrao()">Rodar Testes Padrão </button>

    <div class="painel">
        <h3>Comandos executados:</h3>
        <p>1. <code>minhaTemp = new Termostato(20);</code></p>
        <p>2. <code>minhaTemp.aumentarTemp(90);</code></p>
        <p>3. <code>minhaTemp.diminuirTemp(5);</code></p>
    </div>

</body>

</html>
