<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 4</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            color: #4a2c3a;
            padding: 30px;
            max-width: 450px;
            margin: 0 auto;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            color: #6b4c5e;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.2);
            transition: background-color 0.2s, transform 0.1s;
            margin: 20px 0;
        }

        button:hover {
            background-color: #ff1493;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .painel {
            background: #ffffff;
            padding: 20px;
            border: 2px solid #ffb6c1;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .painel h3 {
            margin-top: 0;
            color: #ff1493;
            font-size: 1.1rem;
            border-bottom: 1px solid #ffe4e1;
            padding-bottom: 8px;
        }

        code {
            background-color: #fff0f5;
            color: #c71585;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .painel p {
            text-align: left;
            font-size: 0.9rem;
            margin: 10px 0;
        }
    </style>
    <script>
        class Pedido {
            constructor(numeroPedido) {
                this.numeroPedido = numeroPedido;
                this.itens = [];
            }

            adicionarItem(nome, preco) {
                this.itens.push({ nome: nome, preco: preco });
            }

            calcularTotal() {
                let total = 0;
                for (const item of this.itens) {
                    total += item.preco;
                }
                console.log(`Valor Total: R$ ${total.toFixed(2)}`);
                return total;
            }

            resumoPedido() {
                console.log(`Agora vamos ver o resumo do seu lanche!`);
                for (const item of this.itens) {
                    console.log(`- ${item.nome}: R$ ${item.preco.toFixed(2)}`);
                }
                this.calcularTotal();
            }
        }

        //const pedido1 = new Pedido();
        //pedido1.adicionarItem("Pizza", 45.00);
        //pedido1.adicionarItem("Refrigerante", 8.50);
        //pedido1.resumoPedido();

        let pedido1;

        function rodarTestesPadrao() {
            pedido1 = new Pedido(1);
            pedido1.adicionarItem("Pizza", 45.00);
            pedido1.adicionarItem("Refrigerante", 8.50);
            pedido1.resumoPedido();
        }
    </script>
</head>

<body>

    <h1>Exercício 4 - Pedido</h1>
    <p>Para ver os resultados clique F12 ou Crtl+Shift+J</p>

    <button onclick="rodarTestesPadrao()">Rodar Testes Padrão </button>

    <div class="painel">
        <h3>Comandos executados:</h3>
        <p>1. <code>pedido1 = new Pedido(1);</code></p>
        <p>2. <code>pedido1.adicionarItem("Pizza", 45.00);</code></p>
        <p>3. <code>pedido1.adicionarItem("Refrigerante", 8.50);</code></p>
        <p>4. <code>pedido1.resumoPedido();</code></p>
    </div>

</body>

</html>
